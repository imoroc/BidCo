# Entorno local completo: PostgreSQL + backend + frontend.
#   docker compose up --build
# Frontend: http://localhost:4200 · API: http://localhost:8080/api
# Necesita POSTGRES_PASSWORD y JWT_SECRET (ver .env.example, sección "Docker Compose").
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bidco
      POSTGRES_USER: bidco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu entorno o en un fichero .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidco -d bidco"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bidco
      SPRING_DATASOURCE_USERNAME: bidco
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 bytes) en tu entorno o en un fichero .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: lax
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:8080"

volumes:
  pgdata:
