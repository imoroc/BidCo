spring.application.name=api-rest

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# En producción conviene usar "validate" y gestionar el esquema con migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Mandatory HS256 secret: at least 32 UTF-8 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework=INFO
logging.level.com.bidco=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud_name=dwgi3kagx
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
springdoc.swagger-ui.path=/swagger-ui.html
# La documentación de la API se desactiva por defecto; activar con SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Orígenes del frontend permitidos por CORS (separados por comas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://bid-co.vercel.app}
# Patrones de origen (los previews de Vercel tienen un dominio distinto en cada despliegue).
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://bid-co-*.vercel.app}
app.timezone=${APP_TIMEZONE:Europe/Madrid}

# Sesiones administrativas desde el frontend desplegado en otro origen.
# En desarrollo local puede establecerse SESSION_COOKIE_SECURE=false y
# SESSION_COOKIE_SAME_SITE=lax.
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Respuestas JSON comprimidas: menos datos por la red en los listados.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# Recuperación de contraseña por correo (API HTTPS de Brevo). Sin clave y remitente, la función se
# desactiva y la API responde 503 en lugar de simular el envío.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:BidCo}
app.frontend-url=${FRONTEND_URL:https://bid-co.vercel.app}

# Cierre automático de subastas y sorteos vencidos (no depende de que alguien abra la ficha).
app.cierre.activo=${CIERRE_ACTIVO:true}
app.cierre.intervalo-ms=${CIERRE_INTERVALO_MS:60000}
app.cierre.retraso-inicial-ms=${CIERRE_RETRASO_INICIAL_MS:30000}
