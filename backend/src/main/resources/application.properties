spring.application.name=api-rest

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Mandatory HS256 secret: at least 32 UTF-8 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

logging.level.org.springframework=INFO
logging.level.com.bidco=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud_name=dwgi3kagx
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
springdoc.swagger-ui.path=/swagger-ui.html

# Sesiones administrativas desde el frontend desplegado en otro origen.
# En desarrollo local puede establecerse SESSION_COOKIE_SECURE=false y
# SESSION_COOKIE_SAME_SITE=lax.
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
