<div class="filter-container">
  <h2>Filtros</h2>
  <button type="button" class="filter-toggle btn-secondary" aria-controls="filtros-cuerpo"
          [attr.aria-expanded]="abierto" (click)="abierto = !abierto">
    {{ abierto ? 'Ocultar filtros' : 'Mostrar filtros' }}@if (filtrosActivos > 0) { ({{ filtrosActivos }}) }
  </button>
  @if (chips.length > 0) {
    <ul class="chip-list" aria-label="Filtros activos">
      @for (chip of chips; track chip.tipo + chip.valor) {
        <li>
          <button type="button" class="chip" (click)="quitarFiltro(chip)">
            {{ chip.texto }}
            <span aria-hidden="true">×</span>
            <span class="sr-only">Quitar filtro</span>
          </button>
        </li>
      }
      <li><button type="button" class="btn-ghost chip-limpiar" (click)="limpiarFiltros()">Limpiar todo</button></li>
    </ul>
  }
  <form id="filtros-cuerpo" [class.abierto]="abierto">
    <!-- Filtro de Precio -->
    <fieldset>
      <legend>Precio</legend>
      <!-- Inputs numéricos -->
      <div class="price-filter">
        <input
          type="number"
          placeholder="Mínimo"
          name="minPriceInput"
          [(ngModel)]="minPrice"
          (input)="applyFilter('min')"
          />
          <input
            type="number"
            placeholder="Máximo"
            name="maxPriceInput"
            [(ngModel)]="maxPrice"
            (input)="applyFilter('max')"
            />
          </div>

          <!-- Slider de rango dual -->
          <div class="range-slider">
            <div class="slider">
              <div class="track"></div>
              <!-- Barra que representa el rango seleccionado -->
              <div
                class="range"
            [ngStyle]="{
              left: ((minPrice - minPossible) / (maxPossible - minPossible)) * 100 + '%',
              width: ((maxPrice - minPrice) / (maxPossible - minPossible)) * 100 + '%'
            }"
              ></div>
              <!-- Thumb para el precio mínimo -->
              <input
                type="range"
                name="minRange"
                aria-label="Precio mínimo"
                class="thumb thumb--left"
                [min]="minPossible"
                [max]="maxPossible"
                [(ngModel)]="minPrice"
                (input)="applyFilter('min')"
                />
                <!-- Thumb para el precio máximo -->
                <input
                  type="range"
                  name="maxRange"
                  aria-label="Precio máximo"
                  class="thumb thumb--right"
                  [min]="minPossible"
                  [max]="maxPossible"
                  [(ngModel)]="maxPrice"
                  (input)="applyFilter('max')"
                  />
                </div>
              </div>
            </fieldset>

            <!-- Filtro de Categoría -->
            <fieldset>
              <legend>Categoría</legend>
              <div class="category-filter">
                @for (category of categories; track category) {
                  <div class="checkbox-group">
                    <input
                      type="checkbox"
                      id="{{ category }}"
                      name="category_{{ category }}"
                      [value]="category"
                      (change)="updateCategoryFilter($event)"
                      [checked]="selectedCategories.includes(category)"
                      />
                      <label for="{{ category }}">{{ category }}</label>
                    </div>
                  }
                </div>
              </fieldset>

              <!-- Filtro por Fecha Restante -->
              <fieldset>
                <legend>Fecha Restante</legend>
                <div class="date-filter">
                  <select name="dateOrder" aria-label="Ordenar por fecha restante" [(ngModel)]="dateOrder" (change)="applyFilter()">
                    <option value="">Por Defecto</option>
                    <option value="asc">Ascendente</option>
                    <option value="desc">Descendente</option>
                  </select>
                </div>
              </fieldset>

              @if (permiteVencidas) {
                <fieldset>
                  <legend>Estado</legend>
                  <div class="checkbox-group">
                    <input
                      type="checkbox"
                      id="mostrar-vencidas"
                      name="mostrarVencidas"
                      [(ngModel)]="mostrarVencidas"
                      (change)="applyFilter()"
                      />
                    <label for="mostrar-vencidas">Mostrar vencidas</label>
                  </div>
                </fieldset>
              }
            </form>
          </div>
