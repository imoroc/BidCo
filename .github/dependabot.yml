version: 2
updates:
  # ── Frontend (npm) ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      angular-core:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "jasmine*"
          - "karma*"
          - "@types/*"
        update-types:
          - minor
          - patch
      miscellaneous:
        update-types:
          - patch
    ignore:
      # Angular 22 exige TypeScript 6.0: no se sube a una versión mayor.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # karma-jasmine 5.1.0 (la última versión) no funciona con jasmine-core 7: fallan las pruebas.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"
 
  # ── Backend (Maven / Java) ───────────────────────────────────
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      jwt:
        patterns:
          - "io.jsonwebtoken:*"
      cloudinary:
        patterns:
          - "com.cloudinary:*"
      misc-java:
        update-types:
          - patch
    labels:
      - "dependencies"
      - "java"
 
  # ── GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"