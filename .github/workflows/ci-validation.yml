name: CI Validation

on:
  push:
    branches: [deploy, master]
  pull_request:
    branches: [deploy]

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export generated lockfile
        run: node -e "const fs=require('fs'); console.log('LOCKFILE_BASE64_START'); console.log(Buffer.from(fs.readFileSync('package-lock.json')).toString('base64')); console.log('LOCKFILE_BASE64_END')"
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build -- --configuration production

  backend-checks:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Verify (compile + tests)
        run: mvn -B clean verify
