name: CI Validation

on:
  push:
    branches: [deploy, master]
  pull_request:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI
      - name: Contraste de los tokens de color
        run: npm run test:contraste
      - name: Production build
        run: npm run build -- --configuration production

  backend-checks:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Verify (compile + tests)
        run: mvn -B clean verify
      - name: Resumen de pruebas del backend
        if: always()
        run: |
          cat target/surefire-reports/*.txt 2>/dev/null | grep -h "^Tests run:" | awk -F'[:,]' '{t+=$2; f+=$4; e+=$6; s+=$8} END {printf "::notice title=Pruebas del backend::%d ejecutadas, %d fallos, %d errores, %d omitidas\n", t, f, e, s}'
          for f in target/surefire-reports/*RepositoryTest.txt; do [ -f "$f" ] && echo "::notice title=Pruebas de repositorio::$(sed -n 2p "$f") | $(sed -n 4p "$f")"; done
          true
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
